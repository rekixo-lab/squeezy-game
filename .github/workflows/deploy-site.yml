# Privacy-policy site (docs/) ko Cloudflare Worker "squeezy-game" par deploy karta hai
# -> https://squeezy-game.rekixo.com . Sirf main branch par push (docs/ ya wrangler.jsonc badle) ya manual run.
# Secrets: CLOUDFLARE_API_TOKEN (sirf "Workers Scripts: Edit" permission), CLOUDFLARE_ACCOUNT_ID.
# Game se iska koi connection nahi; game poori tarah offline hai.
name: Deploy privacy site

on:
  push:
    branches: [main]
    paths: ["docs/**", "wrangler.jsonc"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'rekixo-lab/squeezy-game' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Secrets maujood hain?
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACC" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID set nahi hain, deploy skip."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: "22"

      - name: wrangler deploy
        if: steps.check.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.1 deploy
